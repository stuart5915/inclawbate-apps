<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OnChainSlots</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--c:#00f7ff;--m:#ff00ff;--g:#ffd700;--r:#ff2e63;--bg:#06060b;--panel:rgba(8,12,24,.92);--cab-w:min(440px,100vw);--reel-s:1;--fs:1}
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:#e2e8f0;min-height:100vh;min-height:100dvh;overflow-x:hidden;touch-action:manipulation;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--c);border-radius:3px}

/* ── Responsive scaling ── */
@media(min-width:480px){:root{--cab-w:440px;--reel-s:1;--fs:1}}
@media(min-width:768px){:root{--cab-w:460px;--reel-s:1.05;--fs:1.05}}
@media(min-width:1024px){:root{--cab-w:480px;--reel-s:1.1;--fs:1.1}}
@media(min-width:1400px){:root{--cab-w:520px;--reel-s:1.2;--fs:1.15}}
@media(max-width:360px){:root{--cab-w:100vw;--reel-s:.85;--fs:.9}}
@media(max-width:320px){:root{--cab-w:100vw;--reel-s:.78;--fs:.85}}
@media(orientation:landscape) and (max-height:500px){:root{--cab-w:min(380px,60vh);--reel-s:.85;--fs:.9}body{display:flex;justify-content:center}.cab{min-height:auto}}

/* ── Cabinet ── */
.cab{max-width:var(--cab-w);margin:8px auto;height:calc(100vh - 16px);height:calc(100dvh - 16px);position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#0d1025 0%,#08080f 40%,#050508 100%);display:flex;flex-direction:column;border:2px solid rgba(0,247,255,.15);border-radius:16px;box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 0 20px rgba(0,247,255,.03)}
.cab.shake{animation:shake .4s ease-out}
.edge{display:none}
.edge-l{left:0;background:linear-gradient(180deg,#ffd70066,#00f7ff44,#ff00ff44,#ffd70066);box-shadow:0 0 6px #ffd70033,0 0 15px #00f7ff22}
.edge-r{right:0;background:linear-gradient(180deg,#ff00ff44,#00f7ff44,#ffd70066,#ff00ff44);box-shadow:0 0 6px #ff00ff33,0 0 15px #00f7ff22}

/* ── Ambient Particles ── */
.particle{position:absolute;border-radius:50%;pointer-events:none;opacity:0;animation:floatP linear infinite}
@keyframes floatP{0%{opacity:0;transform:translateY(0) translateX(0)}15%{opacity:.5}50%{opacity:.3}85%{opacity:.5}100%{opacity:0;transform:translateY(-100vh) translateX(30px)}}

/* ── Compact Header (marquee + jackpot merged) ── */
.hdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:linear-gradient(180deg,#0c1028,#080c1a);border-bottom:1px solid #2a2a40;position:relative}
.hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ffd70088,#00f7ff88,#ffd70088,transparent)}
.hdr-title{font-family:Orbitron;font-weight:900;line-height:1}
.hdr-defi{font-size:calc(11px * var(--fs));color:var(--m);letter-spacing:4px;text-shadow:0 0 6px #ff00ff88}
.hdr-jackpot{font-size:calc(11px * var(--fs));letter-spacing:2px;background:linear-gradient(180deg,#00f7ff,#00cc99);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-jp{text-align:right}
.hdr-jp-label{font-family:Orbitron;font-size:6px;font-weight:700;color:rgba(255,215,0,.5);letter-spacing:2px}
.hdr-jp-amt{font-family:Orbitron;font-size:calc(18px * var(--fs));font-weight:900;background:linear-gradient(180deg,#ffe98a,#ffd700,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px rgba(255,215,0,.4));letter-spacing:1px}
.jp-tiers{display:flex;gap:3px;padding:3px 10px 5px;background:linear-gradient(180deg,#080c1a,#06060b);border-bottom:1px solid rgba(255,255,255,.04)}
.jp-tier{flex:1;text-align:center;padding:3px 4px;border-radius:6px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.04)}
.jp-tier-label{font-family:Orbitron;font-size:6px;font-weight:700;letter-spacing:2px}
.jp-tier-amt{font-family:Orbitron;font-size:calc(10px * var(--fs));font-weight:900;letter-spacing:.5px}
.jp-mini .jp-tier-label{color:rgba(0,247,255,.5)}.jp-mini .jp-tier-amt{color:#00f7ff}
.jp-minor .jp-tier-label{color:rgba(168,85,247,.5)}.jp-minor .jp-tier-amt{color:#a855f7}
.jp-major .jp-tier-label{color:rgba(255,107,53,.5)}.jp-major .jp-tier-amt{color:#ff6b35}

/* ── Top Panel ── */
.top-panel{flex-shrink:0;position:relative;z-index:10;background:var(--panel);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,247,255,.08);padding:6px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.brand{font-family:Orbitron;font-size:10px;font-weight:800;color:var(--c);letter-spacing:2px;cursor:default}
.wallet-tag{background:rgba(0,247,255,.08);border:1px solid rgba(0,247,255,.2);border-radius:6px;padding:3px 8px;font-size:9px;color:var(--c);font-family:monospace}
.connect-btn{background:linear-gradient(135deg,#ffd700,#f5a623);border:none;border-radius:6px;padding:5px 14px;color:#000;font-size:9px;font-weight:800;cursor:pointer;font-family:Orbitron;letter-spacing:1px;box-shadow:0 2px 8px rgba(255,215,0,.3)}
.bal-row{display:flex;gap:3px;margin-bottom:4px}
.bal-card{flex:1;background:rgba(0,0,0,.4);border-radius:6px;padding:3px 6px;border:1px solid rgba(255,255,255,.04)}
.bal-label{font-size:7px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1.5px;font-family:Orbitron;font-weight:600}
.bal-val{font-size:calc(13px * var(--fs));font-weight:800;font-family:'Exo 2'}
.bal-total{border-color:rgba(255,215,0,.12);text-align:center;min-width:60px}
.xp-row{display:flex;align-items:center;gap:4px}
.xp-bar{flex:1}
.xp-track{width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.xp-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--m),#a855f7);transition:width .5s;box-shadow:0 0 6px #ff00ff44}
.claim-btn{padding:4px 10px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.25);border-radius:6px;color:var(--g);font-size:9px;font-weight:700;cursor:pointer;font-family:Rajdhani;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:.7;box-shadow:0 0 0 0 rgba(255,215,0,.3)}50%{opacity:1;box-shadow:0 0 0 6px rgba(255,215,0,0)}}
.timer-text{font-size:9px;color:rgba(255,255,255,.3);font-family:'Share Tech Mono'}

/* ── VRF Banner ── */
.vrf-bar{flex-shrink:0;margin:2px 6px 0;padding:5px 8px;background:linear-gradient(90deg,rgba(0,247,255,.05),rgba(255,0,255,.05));border-radius:8px;border:1px solid rgba(0,247,255,.12);display:flex;align-items:center;gap:8px;animation:slideUp .3s}
.vrf-dots{display:flex;gap:3px}
.vrf-dot{width:5px;height:5px;border-radius:50%;background:var(--c)}
@keyframes vrfPulse{0%,100%{opacity:.2}50%{opacity:1}}

/* ── Reel Machine ── */
.machine{margin:3px 6px 0;position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.machine-outer{border-radius:14px;padding:3px;flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#7a7a8a 0%,#4a4a5a 8%,#3a3a48 20%,#2a2a38 50%,#3a3a48 80%,#4a4a5a 92%,#7a7a8a 100%);box-shadow:0 6px 20px rgba(0,0,0,.6),0 0 1px rgba(255,255,255,.15),inset 0 1px 0 rgba(255,255,255,.2);position:relative}
.rivet{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#999,#555,#333);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 1px 2px rgba(0,0,0,.5);z-index:5}
.machine-inner{border-radius:11px;padding:3px;flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a1a28,#0a0a14,#1a1a28);box-shadow:inset 0 2px 10px rgba(0,0,0,.8)}
.machine-face{border-radius:9px;overflow:hidden;position:relative;background:linear-gradient(180deg,#0a0e1e,#060810,#0a0e1e);box-shadow:inset 0 0 50px rgba(0,0,0,.7);padding:6px;flex:1;display:flex;flex-direction:column;justify-content:center}
.glass{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.03) 0%,transparent 30%,transparent 70%,rgba(255,255,255,.02) 100%);pointer-events:none;z-index:8;border-radius:9px}

/* ── Reels ── */
.reel-grid{display:flex;gap:3px;justify-content:center;position:relative}
.reel-col{display:flex;flex-direction:column;gap:1px;width:calc(66px * var(--reel-s));position:relative}
.reel-col.landing .reel-cell.mid{animation:reelLand .35s ease-out}
@keyframes reelLand{0%{transform:translateY(-20px) scaleY(1.08)}45%{transform:translateY(6px) scaleY(.94)}75%{transform:translateY(-2px)}100%{transform:translateY(0) scaleY(1)}}
.reel-cell{height:calc(36px * var(--reel-s));display:flex;align-items:center;justify-content:center;font-size:calc(22px * var(--reel-s));position:relative;overflow:hidden;transition:opacity .15s}
.reel-cell.top,.reel-cell.bot{opacity:.25;filter:blur(1px);font-size:calc(18px * var(--reel-s))}
.reel-cell.mid{height:calc(56px * var(--reel-s));font-size:calc(34px * var(--reel-s));background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.04),rgba(255,255,255,.02));border-radius:8px;border:1px solid rgba(255,255,255,.04);position:relative}
.reel-cell.mid.held{border:2px solid rgba(0,247,255,.5);background:rgba(0,247,255,.06);animation:heldGlow 1.5s infinite}
@keyframes heldGlow{0%,100%{box-shadow:0 0 8px rgba(0,247,255,.2),inset 0 0 8px rgba(0,247,255,.08)}50%{box-shadow:0 0 18px rgba(0,247,255,.4),0 0 35px rgba(0,247,255,.15),inset 0 0 12px rgba(0,247,255,.15)}}
.reel-cell.mid.win-cell{border-color:rgba(255,215,0,.6);background:rgba(255,215,0,.08);animation:winCellGlow .5s ease-out}
@keyframes winCellGlow{0%{box-shadow:0 0 20px rgba(255,215,0,.6),inset 0 0 20px rgba(255,215,0,.2)}100%{box-shadow:0 0 8px rgba(255,215,0,.2),inset 0 0 8px rgba(255,215,0,.05)}}
.held-badge{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:6px;font-weight:900;color:var(--c);letter-spacing:1px;font-family:Orbitron;text-shadow:0 0 4px #00f7ff;z-index:3}
.held-val{font-size:6px;color:#fff;font-weight:700}

/* ── Payline ── */
.payline{position:absolute;top:50%;left:4px;right:4px;height:2px;transform:translateY(-50%);border-radius:2px;z-index:9;pointer-events:none;transition:all .3s}
.payline.idle{background:linear-gradient(90deg,transparent,rgba(255,0,255,.3),rgba(0,247,255,.4),rgba(255,0,255,.3),transparent);animation:paylineIdle 3s infinite}
.payline.win{height:3px;background:linear-gradient(90deg,transparent,#ffd700,#ffd700,transparent);animation:paylineWin .5s infinite}
@keyframes paylineIdle{0%,100%{opacity:.3;box-shadow:none}50%{opacity:.8;box-shadow:0 0 12px rgba(0,247,255,.3)}}
@keyframes paylineWin{0%,100%{box-shadow:0 0 10px #ffd700}50%{box-shadow:0 0 25px #ffd700,0 0 50px rgba(255,215,0,.3)}}

/* ── H&S Banner ── */
.hs-banner{text-align:center;margin-bottom:6px;padding:5px 8px;background:rgba(0,247,255,.06);border-radius:8px;border:1px solid rgba(0,247,255,.15);animation:slideUp .3s}
.hs-title{font-family:Orbitron;font-size:11px;font-weight:900;color:var(--c);letter-spacing:3px;text-shadow:0 0 8px #00f7ff}
.hs-stats{display:flex;justify-content:center;gap:12px;margin-top:3px;font-size:10px;color:rgba(255,255,255,.6)}

/* ── Result Display ── */
.result-box{min-height:24px;display:flex;align-items:center;justify-content:center;margin-top:3px;position:relative}
.result-box .win-label{font-family:Orbitron;font-weight:900;letter-spacing:2px;animation:slideUp .3s}
.result-box .win-amount{font-family:Orbitron;font-weight:900;color:var(--g);text-shadow:0 0 12px #ffd700;animation:winPop .4s ease-out}
@keyframes winPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

/* ── LED Meters ── */
.meters{display:flex;justify-content:space-around;margin-top:3px;padding:3px 0;border-top:1px solid rgba(255,255,255,.04)}
.meter{text-align:center}
.meter-label{font-size:6px;color:rgba(255,255,255,.25);font-family:Orbitron;font-weight:600;letter-spacing:1.5px}
.meter-val{font-family:'Share Tech Mono';font-size:10px;font-weight:700;color:var(--c);letter-spacing:1px;text-shadow:0 0 4px var(--c)}

/* ── Controls ── */
.ctrl-panel{flex-shrink:0;margin:3px 6px 0;background:linear-gradient(180deg,#141422,#0c0c18,#141422);border-radius:10px;border:1px solid rgba(255,255,255,.05);padding:6px 6px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.ctrl-label{font-size:7px;font-family:Orbitron;color:rgba(255,255,255,.3);letter-spacing:2px;font-weight:600}
.bet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-bottom:3px}
.bet-btn,.batch-btn,.auto-btn{padding:5px 6px;border-radius:5px;font-size:calc(10px * var(--fs));min-height:30px;font-weight:700;cursor:pointer;font-family:Rajdhani;letter-spacing:.5px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:rgba(255,255,255,.35);transition:all .15s}
.bet-btn.on{background:rgba(0,247,255,.1);border-color:rgba(0,247,255,.3);color:var(--c)}
.batch-btn.on{background:rgba(255,0,255,.1);border-color:rgba(255,0,255,.3);color:var(--m)}
.auto-btn.on{background:rgba(255,0,255,.1);border-color:rgba(255,0,255,.3);color:var(--m)}
.batch-row,.auto-row{display:flex;gap:2px;margin-bottom:3px}
.batch-btn,.auto-btn{flex:1;text-align:center}
.btn-row{display:flex;gap:4px}
.spin-btn{flex:2;padding:10px 0;border-radius:10px;color:#fff;font-size:calc(15px * var(--fs));min-height:42px;font-weight:900;font-family:Orbitron;cursor:pointer;letter-spacing:3px;transition:all .1s;position:relative;overflow:hidden}
.spin-btn:active:not(:disabled){transform:scale(.96)}
.spin-btn:disabled{opacity:.5;cursor:not-allowed}
.spin-btn.normal{background:linear-gradient(180deg,#cc1a2a,#8a0012,#aa0018,#cc1a2a);border:2px solid rgba(255,50,50,.4);box-shadow:0 4px 15px rgba(255,0,0,.2),inset 0 1px 0 rgba(255,255,255,.12)}
.spin-btn.stop{background:linear-gradient(180deg,#ff4757,#cc2233,#ff4757);border:2px solid rgba(255,71,87,.5)}
.spin-btn.hs{background:linear-gradient(180deg,#00b8bc,#006a6e,#00b8bc);border:2px solid rgba(0,247,255,.5);box-shadow:0 0 20px rgba(0,247,255,.2);animation:hsPulse 1.2s infinite}
@keyframes hsPulse{0%,100%{box-shadow:0 0 10px rgba(0,247,255,.2)}50%{box-shadow:0 0 25px rgba(0,247,255,.4)}}

/* ── Nav ── */
.nav-grid{flex-shrink:0;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:3px 6px;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{padding:4px 0;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.04);border-radius:6px;color:rgba(255,255,255,.4);font-size:calc(7px * var(--fs));min-height:34px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:Rajdhani;transition:all .15s}
.nav-btn:active{background:rgba(0,247,255,.05);color:var(--c)}

/* ── Modals ── */
.modal-bg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);display:flex;align-items:flex-start;justify-content:center;padding:28px 12px 12px;overflow-y:auto;animation:fadeIn .2s}
.modal-box{width:100%;max-width:var(--cab-w);background:linear-gradient(180deg,#10142a,#0a0e1c);border-radius:14px;border:1px solid rgba(0,247,255,.15);animation:slideUp .25s;box-shadow:0 0 40px rgba(0,0,0,.5),0 0 1px rgba(0,247,255,.2)}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(0,247,255,.08)}
.modal-hdr span{font-family:Orbitron;font-size:12px;font-weight:700;color:var(--c);letter-spacing:1.5px}
.modal-close{background:rgba(0,247,255,.08);border:1px solid rgba(0,247,255,.15);border-radius:6px;width:26px;height:26px;color:var(--c);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:12px 14px;max-height:68vh;overflow-y:auto}
.pill{padding:6px 9px;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;font-family:Rajdhani;letter-spacing:.5px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:rgba(255,255,255,.35);transition:all .15s}
.pill.on{background:rgba(0,247,255,.1);border-color:rgba(0,247,255,.3);color:var(--c)}
input[type=number],input[type=text]{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:10px 12px;color:#fff;font-size:13px;font-family:'Exo 2';outline:none;width:100%;transition:border-color .2s;-webkit-appearance:none;-moz-appearance:none;appearance:none}
input:focus{border-color:rgba(0,247,255,.3)}

/* ── Win Flash ── */
.win-flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,215,0,.15),transparent 70%);pointer-events:none;z-index:7;border-radius:9px;animation:flash .4s ease-out forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

/* ── Confetti ── */
.confetti-dot{position:fixed;top:-20px;width:6px;height:6px;border-radius:1px;z-index:600;pointer-events:none}
@keyframes confFall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(720deg) scale(.3);opacity:0}}

/* ── General Animations ── */
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}10%{transform:translateX(-4px)}20%{transform:translateX(4px)}30%{transform:translateX(-3px)}40%{transform:translateX(3px)}50%{transform:translateX(-2px)}60%{transform:translateX(2px)}70%{transform:translateX(-1px)}80%{transform:translateX(1px)}}
/* ── Desktop: ambient glow behind cabinet ── */
@media(min-width:480px){body{background:var(--bg) radial-gradient(ellipse at 50% 30%,rgba(0,247,255,.03),transparent 60%)}
.cab{box-shadow:0 0 80px rgba(0,0,0,.5),0 0 120px rgba(0,247,255,.02)}}
</style>
</head>
<body>
<div id="app" class="cab">
  <div class="edge edge-l"></div>
  <div class="edge edge-r"></div>
</div>
<div id="particle-box"></div>
<div id="confetti-box"></div>
<div id="modal-root"></div>

<script>
// ═══════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════
const ADMIN_W="0x18b18E245122f4bDA5F2ee4F25c702E05C241D49";
const VAULT="0x63bFC949b9B53D8A28E3590d625Fc7aC8EAf6600";
const CLAWS_TOKEN="0x7ca47B141639B893C6782823C0b219f872056379";
const USDC_TOKEN="0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913";
const BASE_RPC="https://mainnet.base.org";
const BASE_CHAIN="0x2105";
const CLAWS_BONUS=1.10,ETH_BONUS=1.05,WITHDRAW_FEE=0.01;
const CHIP_PACKS=[
  {chips:500000,tag:"500K"},
  {chips:2000000,tag:"2M"},
  {chips:5000000,tag:"5M",hot:true},
  {chips:10000000,tag:"10M"},
  {chips:25000000,tag:"25M"},
  {chips:50000000,tag:"50M"}
];

// Shuffle array (Fisher-Yates)
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

// Map multiplier → {count, wild, label} for reel generation
const MULT_MAP=[
  {min:100,mc:5,wild:true,lbl:"5x WILD JACKPOT",x:"100x"},

  {min:3,mc:3,wild:false,lbl:"3 of a Kind",x:"3x"},
  {min:2,mc:2,wild:true,lbl:"2x WILD",x:"2x"},
  {min:1.5,mc:2,wild:false,lbl:"2 of a Kind",x:"1.5x"}
];

// Generate reel symbols that truthfully match the payout
function genReels(mult,t){
  const w=t.w,ns=t.s.filter(s=>s!==w);
  const fin=Array(5),wc=[];
  // Find matching tier
  let tier=null;
  for(const m of MULT_MAP){if(mult>=m.min){tier=m;break}}
  if(tier){
    const pos=shuf([0,1,2,3,4]);
    const mPos=pos.slice(0,tier.mc),oPos=pos.slice(tier.mc);
    const sym=tier.wild?w:pk(ns);
    mPos.forEach(i=>{fin[i]=sym;wc.push(i)});
    // Fill remaining with unique non-matching, non-wild symbols
    const pool=shuf(ns.filter(s=>s!==sym));
    oPos.forEach((p,idx)=>{fin[p]=pool[idx]||pk(ns.filter(s=>s!==sym))});
  }else{
    // Loss/breakeven: all different, no wilds, no pairs
    const pick=shuf(ns).slice(0,5);
    for(let i=0;i<5;i++)fin[i]=pick[i]||ns[i%ns.length];
  }
  return{fin,wc,lbl:tier?tier.lbl:"",x:tier?tier.x:""}
}

let _actx=null;
let _sfxOn=true;
function actx(){if(!_actx)try{_actx=new(window.AudioContext||window.webkitAudioContext)()}catch{}return _actx}
function sfx(fn){if(!_sfxOn)return;const c=actx();if(!c)return;if(c.state==='suspended')c.resume();try{fn(c)}catch{}}
function noiseBuf(c,dur){const sr=c.sampleRate,len=sr*dur,buf=c.createBuffer(1,len,sr),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return buf}

function sndSpin(){sfx(c=>{
  const t=c.currentTime;
  // Mechanical whirring - filtered noise
  const nb=c.createBufferSource();nb.buffer=noiseBuf(c,0.8);nb.loop=true;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2000;bp.Q.value=3;
  const g=c.createGain();g.gain.setValueAtTime(0.06,t);
  g.gain.linearRampToValueAtTime(0.08,t+0.1);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.7);
  nb.connect(bp);bp.connect(g);g.connect(c.destination);
  nb.start(t);nb.stop(t+0.7);
  // Rapid clicking ticks
  for(let i=0;i<12;i++){
    const ns=c.createBufferSource();ns.buffer=noiseBuf(c,0.02);
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=4000;
    const gg=c.createGain();gg.gain.value=0.04;
    ns.connect(hp);hp.connect(gg);gg.connect(c.destination);
    ns.start(t+i*0.05);ns.stop(t+i*0.05+0.02);
  }
})}

  if(S.mod==='welcome'){title='ONCHAIN SLOTS';body=modalWelcome()}

  else if(S.mod==='themes'){title='THEMES';body=modalThemes()}
  else if(S.mod==='pay'){title='PAYTABLE';body=modalPay()}
  else if(S.mod==='history'){title='SPIN HISTORY';body=modalHistory()}
  else if(S.mod==='leaderboard'){title='LEADERBOARD';body=modalLeaderboard()}

function getWallet(){
  try{
    const m=document.cookie.match(/inclawbate_token=([^;]+)/);
    if(!m)return null;
    const p=JSON.parse(atob(decodeURIComponent(m[1]).split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return p.wallet_address||null;
  }catch{return null}
}
function vaultAddr(){return ADMIN_W}
async function rpcCall(method,params){
  const r=await fetch(BASE_RPC,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
  return(await r.json()).result;
}
async function getEthBal(w){
  try{const r=await rpcCall('eth_getBalance',[w,'latest']);return Number(BigInt(r||'0x0'))/1e18}catch{return 0}
}
async function getTokenBal(token,w,dec=18){
  try{
    const data='0x70a08231'+w.slice(2).toLowerCase().padStart(64,'0');
    const r=await rpcCall('eth_call',[{to:token,data},'latest']);
    return Number(BigInt(r||'0x0')/BigInt(10**(dec-4)))/1e4;
  }catch{return 0}
}

async function auditBalance(){
  if(!S.wal)return;
  S.res={m:0,l:"Auditing wallet...",j:false,w:0};render();
  try{
    // 1. Reload saved state + withdrawal queue + prices (retry prices once)
    await Promise.all([loadChips(),loadWdQueue()]);
    await fetchPrices();
    if(PAY_TOKENS.claws.rate===0){await fetchPrices()}

    // 2. Scan on-chain for ALL token transfers from this wallet to vault
    const vault=VAULT.toLowerCase();
    const admin=ADMIN_W.toLowerCase(); // also check old creator wallet
    let totalDepChips=0;
    const findings={clawsDeps:[],usdcDeps:[],ethDeps:[],wds:[]};

    // Use live rate or fallback for chip calculation
    const clawsRate=PAY_TOKENS.claws.rate>0?PAY_TOKENS.claws.rate:0.000005*1e6;
    const ethRate=PAY_TOKENS.eth.rate>0?PAY_TOKENS.eth.rate:2500*1e6;
    let scanOk=false;

    // Fetch token transfers via Basescan API
    try{
      const url=`https://api.basescan.org/api?module=account&action=tokentx&address=${S.wal}&startblock=0&endblock=99999999&sort=asc`;
      const res=await fetch(url);const json=await res.json();
      const txs=json.status==='1'?json.result:[];
      scanOk=true;
      const from=S.wal.toLowerCase();

      // CLAWS deposits (to vault OR old creator wallet)
      txs.filter(tx=>tx.contractAddress.toLowerCase()===CLAWS_TOKEN.toLowerCase()&&tx.from.toLowerCase()===from&&(tx.to.toLowerCase()===vault||tx.to.toLowerCase()===admin)).forEach(tx=>{
        const amount=Number(BigInt(tx.value))/1e18;
        const logEntry=S.depLog.find(d=>d.tx&&d.tx.toLowerCase()===tx.hash.toLowerCase());
        let chips;
        if(logEntry){chips=logEntry.chips}
        else{chips=Math.round(amount*clawsRate*CLAWS_BONUS);if(chips>=5000000)chips+=5000000}
        totalDepChips+=chips;
        findings.clawsDeps.push({amount,chips,tx:tx.hash,time:tx.timeStamp*1000});
      });

      // USDC deposits
      txs.filter(tx=>tx.contractAddress.toLowerCase()===USDC_TOKEN.toLowerCase()&&tx.from.toLowerCase()===from&&(tx.to.toLowerCase()===vault||tx.to.toLowerCase()===admin)).forEach(tx=>{
        const amount=Number(BigInt(tx.value))/1e6;
        const logEntry=S.depLog.find(d=>d.tx&&d.tx.toLowerCase()===tx.hash.toLowerCase());
        let chips;
        if(logEntry){chips=logEntry.chips}
        else{chips=Math.round(amount*1e6);if(chips>=5000000)chips+=5000000}
        totalDepChips+=chips;
        findings.usdcDeps.push({amount,chips,tx:tx.hash,time:tx.timeStamp*1000});
      });
    }catch(e){console.log('[dev] Token scan failed:',e)}

    // ETH deposits via transaction list
    try{
      const url=`https://api.basescan.org/api?module=account&action=txlist&address=${S.wal}&startblock=0&endblock=99999999&sort=asc`;
      const res=await fetch(url);const json=await res.json();
      const txs=json.status==='1'?json.result:[];
      scanOk=true;
      const from=S.wal.toLowerCase();
      txs.filter(tx=>tx.from.toLowerCase()===from&&(tx.to.toLowerCase()===vault||tx.to.toLowerCase()===admin)&&tx.value!=='0'&&tx.isError==='0').forEach(tx=>{
        const amount=Number(BigInt(tx.value))/1e18;
        const logEntry=S.depLog.find(d=>d.tx&&d.tx.toLowerCase()===tx.hash.toLowerCase());
        let chips;
        if(logEntry){chips=logEntry.chips}
        else{chips=Math.round(amount*ethRate*ETH_BONUS);if(chips>=5000000)chips+=5000000}
        totalDepChips+=chips;
        findings.ethDeps.push({amount,chips,tx:tx.hash,time:tx.timeStamp*1000});
      });
    }catch(e){console.log('[dev] ETH scan failed:',e)}

    // 3. Withdrawal audit
    const myWd=S.wdQ.filter(r=>S.wal&&r.wal.toLowerCase()===S.wal.toLowerCase());
    const paidWd=myWd.filter(r=>r.status==='paid').reduce((a,r)=>a+r.amt,0);
    const pendingWd=myWd.filter(r=>r.status==='pending'||r.status==='processing').reduce((a,r)=>a+r.amt,0);
    findings.wds=myWd;

    // 4. Calculate expected balance
    // expected = deposits + net_gameplay - withdrawals
    // net_gameplay = (tGR + hsW) - tBt (gross returned + hold&spin - total wagered)
    const netPlay=(S.tGR+S.hsW)-S.tBt;
    const totalWd=paidWd+pendingWd;
    const expected=Math.max(0,totalDepChips+netPlay-totalWd);
    const current=S.bB+S.rB;
    const diff=Math.round(expected-current);
    let depCount=findings.clawsDeps.length+findings.usdcDeps.length+findings.ethDeps.length;

    // 5. Fix if balance doesn't match expected
    if(diff>0){
      const maxRestore=Math.max(0,totalDepChips-totalWd-current);
      const restore=Math.min(diff,maxRestore);
      if(restore>0){S.bB+=restore;await saveChips()}
    }else if(diff<-10000){
      console.warn('[AUDIT] Balance is',fm(-diff),'higher than expected — may indicate promos, free claims, or data issue');
    }

    // 6. Refresh on-chain token balances
    await refreshBal();

    // 7. If on-chain scan failed, reconstruct from depLog
    if(!scanOk&&S.depLog.length>0){
      totalDepChips=S.depLog.reduce((a,d)=>a+(d.chips||0),0);
      depCount=S.depLog.length;
    }

    // Recalculate with whatever data we have
    const netPlay2=(S.tGR+S.hsW)-S.tBt;
    const totalWd2=paidWd+pendingWd;
    const expected2=Math.max(0,totalDepChips+netPlay2-totalWd2);
    const current2=S.bB+S.rB;
    const diff2=Math.round(expected2-current2);
    if(diff2>diff){
      const maxRestore2=Math.max(0,totalDepChips-totalWd2-current2);
      const restore2=Math.min(diff2,maxRestore2);
      if(restore2>0){S.bB+=restore2;await saveChips()}
    }
    const finalDiff=Math.max(diff,diff2);

    // 7. Show audit results
    let msg='';
    if(depCount===0&&current===0){msg='No deposits found — use promo or buy chips'}
    else if(finalDiff>0){msg=`+${fm(finalDiff)} chips restored`}
    else if(finalDiff===0){msg=`Balance correct (${depCount} dep${depCount!==1?'s':''})`}
    else{msg=`Balance verified (${depCount} dep${depCount!==1?'s':''})`}

    S.res={m:finalDiff>0?2:0,l:msg,j:false,w:finalDiff>0?finalDiff:0};

    // Log audit details to console for transparency
    console.log('[AUDIT]',{
      scanOk,
      deposits:{claws:findings.clawsDeps.length,usdc:findings.usdcDeps.length,eth:findings.ethDeps.length,totalChips:totalDepChips,depLog:S.depLog.length},
      gameplay:{wagered:S.tBt,grossReturn:S.tGR,hsWin:S.hsW,net:netPlay},
      withdrawals:{paid:paidWd,pending:pendingWd,total:totalWd},
      balance:{expected,current,diff,finalDiff}
    });

    render();
  }catch(e){
    console.log('[dev] Audit failed:',e);
    await refreshBal();
    S.res={m:0,l:"Audit error - try again",j:false,w:0};
    render();
  }
}

function _buildSaveData(){
  const d={bB:S.bB,rB:S.rB,tW:S.tW,tGR:S.tGR,tBt:S.tBt,hsW:S.hsW,xp:S.xp,hist:S.hist.slice(0,20),lastClaim:S.lastClaim,tk:S.tk,bet:S.bet,batchN:S.batchN,pTk:S.pTk,promoBonus:S.promoBonus,promoDisc:S.promoDisc,usedPromos:S.usedPromos,depLog:S.depLog.slice(0,200)};
  d._h=_integ(d);return d;
}
function _saveLocal(data){
  try{localStorage.setItem('djSlots',JSON.stringify(data));
    if(S.bB+S.rB>0)localStorage.setItem('djSlots_bak',JSON.stringify({bB:S.bB,rB:S.rB,tW:S.tW,tGR:S.tGR,tBt:S.tBt,hsW:S.hsW,xp:S.xp,depLog:S.depLog.slice(0,200),t:Date.now()}));
  }catch{}
}
function _loadLocal(){
  try{const raw=localStorage.getItem('djSlots');return raw?JSON.parse(raw):null}catch{return null}
}
function _loadLocalBak(){
  try{const raw=localStorage.getItem('djSlots_bak');return raw?JSON.parse(raw):null}catch{return null}
}
function _applyData(d){
  if(!d)return false;
  if(d._h!==undefined&&d._h!==_integ(d)){console.warn('[INTEGRITY] Data tampering detected — resetting balances');d.bB=0;d.rB=0;d.tW=0;d.tGR=0;d.tBt=0;d.hsW=0;d.xp=0}
  S.bB=d.bB||0;S.rB=d.rB||0;S.tW=d.tW||0;S.tGR=d.tGR||0;S.tBt=d.tBt||0;S.hsW=d.hsW||0;S.xp=d.xp||0;
  if(d.hist)S.hist=d.hist;if(Array.isArray(d.usedPromos))S.usedPromos=d.usedPromos;
  if(d.tk&&TH[d.tk]){S.tk=d.tk;const t=TH[d.tk];S.reels=t.s.slice(0,5);S.reelTop=t.s.slice(1,6).concat(t.s).slice(0,5);S.reelBot=t.s.slice(3,8).concat(t.s).slice(0,5)}
  if(d.bet&&BTS.includes(d.bet))S.bet=d.bet;
  if(d.batchN&&BATCHES.includes(d.batchN))S.batchN=d.batchN;
  if(d.pTk&&PAY_TOKENS[d.pTk])S.pTk=d.pTk;
  if(d.promoBonus>0)S.promoBonus=d.promoBonus;
  if(d.promoDisc>0)S.promoDisc=d.promoDisc;
  if(Array.isArray(d.depLog))S.depLog=d.depLog;
  if(d.lastClaim){
    S.lastClaim=d.lastClaim;
    const c=info(),cooldown=c.vip.f*60*1000;
    const elapsed=Date.now()-d.lastClaim;
    if(elapsed<cooldown){S.fR=false;S.fT=Math.ceil((cooldown-elapsed)/1000)}else{S.fR=true;S.fT=0}
  }
  return true;
}
async function saveChips(){
  const data=_buildSaveData();
  // Always save to localStorage (survives browser close)
  _saveLocal(data);
  // Save to AppDB (server-side, survives everything)
  if(!window.AppDB||!S._dbOk)return;
  try{
    await window.AppDB.set('djSlots',data);
    if(S.bB+S.rB>0)await window.AppDB.set('djSlots_bak',{bB:S.bB,rB:S.rB,tW:S.tW,tGR:S.tGR,tBt:S.tBt,hsW:S.hsW,xp:S.xp,depLog:S.depLog.slice(0,200),t:Date.now()});
  }catch(e){console.log('[dev] Save failed:',e)}
}
async function loadChips(){
  // 1. Load from localStorage instantly (fastest, survives browser close)
  let localData=_loadLocal();
  let loaded=false;
  if(localData){_applyData(localData);loaded=true;console.log('[LOCAL] Loaded from localStorage')}

  // 2. Load from AppDB (server-side, authoritative, survives history clear)
  if(window.AppDB){
    try{
      const d=await window.AppDB.get('djSlots');
      S._dbOk=true;
      if(d){
        // AppDB is authoritative - use it if it has data
        _applyData(d);loaded=true;
        // Sync localStorage with server data
        _saveLocal(d);
        console.log('[APPDB] Loaded from server');
        // Auto-restore from backup if main data was wiped
        if(S.bB===0&&S.rB===0){
          // Check AppDB backup first
          let bak=null;
          try{bak=await window.AppDB.get('djSlots_bak')}catch{}
          // Fall back to localStorage backup
          if(!bak||(!bak.bB&&!bak.rB))bak=_loadLocalBak();
          if(bak&&(bak.bB>0||bak.rB>0)){
            S.bB=bak.bB;S.rB=bak.rB;
            if(S.tW===0&&bak.tW>0){S.tW=bak.tW;S.tGR=bak.tGR||0;S.tBt=bak.tBt||0;S.hsW=bak.hsW||0}
            if(S.depLog.length===0&&Array.isArray(bak.depLog))S.depLog=bak.depLog;
            console.log('[RESTORE] Chips restored from backup:',bak.bB+bak.rB);
            const restored={...d,bB:S.bB,rB:S.rB,tW:S.tW,tGR:S.tGR,tBt:S.tBt,hsW:S.hsW,depLog:S.depLog};
            await window.AppDB.set('djSlots',restored);
            _saveLocal(restored);
          }
        }
      } else if(loaded&&localData){
        // AppDB empty but localStorage has data - push local up to server
        console.log('[SYNC] Pushing localStorage data to AppDB');
        _applyData(localData);
        await window.AppDB.set('djSlots',localData);
        if(S.bB+S.rB>0)await window.AppDB.set('djSlots_bak',{bB:S.bB,rB:S.rB,tW:S.tW,tGR:S.tGR,tBt:S.tBt,hsW:S.hsW,xp:S.xp,depLog:S.depLog.slice(0,200),t:Date.now()});
      }
    }catch(e){console.log('[dev] AppDB load failed, using localStorage:',e)}
  }
  // 3. Last resort - check localStorage backup
  if(!loaded||( S.bB===0&&S.rB===0)){
    const lbak=_loadLocalBak();
    if(lbak&&(lbak.bB>0||lbak.rB>0)){
      S.bB=lbak.bB;S.rB=lbak.rB;
      if(S.tW===0&&lbak.tW>0){S.tW=lbak.tW;S.tGR=lbak.tGR||0;S.tBt=lbak.tBt||0;S.hsW=lbak.hsW||0}
      if(S.depLog.length===0&&Array.isArray(lbak.depLog))S.depLog=lbak.depLog;
      console.log('[RESTORE] Restored from localStorage backup');
    }
  }
}

async function buyPack(idx){
  if(!S.wal||S.txP)return;
  const pack=CHIP_PACKS[idx];if(!pack)return;
  const tk=PAY_TOKENS[S.pTk];
  if(tk.rate===0){S.txR={t:"err",msg:"Price unavailable for "+tk.lbl};renderModal();return}
  const disc=S.promoDisc;
  const cost=(pack.chips/tk.rate)*(1-disc);
  const bal=S.pTk==='claws'?S.clawsBal:S.pTk==='eth'?S.ethBal:S.usdcBal;
  if(bal<cost)return;
  S.txP=true;S.txR=null;renderModal();
  const extra=S.promoBonus;
  try{
    let txHash;
    const dest=vaultAddr();
    if(S.pTk==='claws'){
      txHash=await sendERC20(CLAWS_TOKEN,dest,cost,18);
    }else if(S.pTk==='eth'){
      txHash=await sendETH(dest,cost);
    }else{
      txHash=await sendERC20(USDC_TOKEN,dest,cost,6);
    }
    const chips=Math.round(pack.chips*(tk.bonus+extra));
    S.bB+=chips;
    let bonusAwarded=0;
    if(chips>=5000000){bonusAwarded=5000000;S.bB+=bonusAwarded}
    const costStr=cost<0.01?cost.toFixed(6):cost<1?cost.toFixed(4):cost<1000?cost.toFixed(2):fm(cost);
    S.depLog.push({t:Date.now(),tk:S.pTk,cost,chips:chips+bonusAwarded,rate:tk.rate,tx:txHash||"confirmed"});
    S.txR={t:"dep",token:tk.lbl,amt:costStr,chips,bonus:bonusAwarded,h:txHash||"confirmed"};
    S.promoBonus=0;S.promoDisc=0;S.txP=false;
    await Promise.all([refreshBal(),saveChips()]);
    render();
  }catch(e){
    S.txP=false;
    S.txR={t:"err",msg:e.message||"Transaction failed"};renderModal();
  }
}

async function saveWdQueue(){
  if(!window.AppDB)return;
  try{
    // Read-merge-write: re-read global queue, merge local changes, then save
    const remote=await window.AppDB.getGlobal('wdQueue');
    const rList=Array.isArray(remote)?remote.filter(r=>r&&r.id&&r.wal):[];
    const rMap=new Map(rList.map(r=>[r.id,r]));
    // Apply local state changes — only own new requests or admin status updates
    const ci=info();
    S.wdQ.forEach(r=>{
      const existing=rMap.get(r.id);
      if(existing){if(ci.isAdmin)rMap.set(r.id,r)}
      else if(S.wal&&r.wal.toLowerCase()===S.wal.toLowerCase())rMap.set(r.id,r);
    });
    const merged=[...rMap.values()].slice(-500);
    await window.AppDB.setGlobal('wdQueue',merged);
    S.wdQ=merged;
  }catch(e){console.log('[dev] Queue save failed:',e)}
}

    const jp=await window.AppDB.getGlobal('jackpots');
    if(jp){
      S.jackpot=jp.grand>=1000000?jp.grand:1000000;
      S.jpMajor=jp.major>=250000?jp.major:250000;
      S.jpMinor=jp.minor>=100000?jp.minor:100000;
      S.jpMini=jp.mini>=50000?jp.mini:50000;
      S.housePool=jp.house||0;
    }else{
      const old=await window.AppDB.getGlobal('jackpot');
      if(old&&old>=1000000)S.jackpot=old;else S.jackpot=1000000;
      S.jpMajor=250000;S.jpMinor=100000;S.jpMini=50000;S.housePool=0;
      saveJackpot();
    }
  }catch{}
  updateJpDisplay();
}
async function saveJackpot(){
  if(!window.AppDB)return;
  try{
    const remote=await window.AppDB.getGlobal('jackpots');
    const jp={grand:S.jackpot,major:S.jpMajor,minor:S.jpMinor,mini:S.jpMini,house:S.housePool};
    if(remote){
      jp.grand=jp.grand<=1000000?jp.grand:Math.max(jp.grand,remote.grand||0);
      jp.major=jp.major<=250000?jp.major:Math.max(jp.major,remote.major||0);
      jp.minor=jp.minor<=100000?jp.minor:Math.max(jp.minor,remote.minor||0);
      jp.mini=jp.mini<=50000?jp.mini:Math.max(jp.mini,remote.mini||0);
      jp.house=Math.max(jp.house,remote.house||0);
      S.jackpot=jp.grand;S.jpMajor=jp.major;S.jpMinor=jp.minor;S.jpMini=jp.mini;S.housePool=jp.house;
    }
    await window.AppDB.setGlobal('jackpots',jp);
  }catch{}
}
async function doWithdraw(){
  if(!S.wal||S.txP)return;const amt=parseInt(S.wdAmt);if(!amt||amt<=0||amt>S.rB)return;
  if(amt<1000){S.txR={t:"err",msg:"Minimum withdrawal: 1,000 chips"};renderModal();return}
  if(S._lastWd&&Date.now()-S._lastWd<5000){S.txR={t:"err",msg:"Please wait between requests"};renderModal();return}
  const myPending=S.wdQ.filter(r=>S.wal&&r.wal.toLowerCase()===S.wal.toLowerCase()&&(r.status==='pending'||r.status==='processing'));
  if(myPending.length>=3){S.txR={t:"err",msg:"Max 3 pending requests at a time"};renderModal();return}
  S._lastWd=Date.now();
  const fee=Math.round(amt*WITHDRAW_FEE),net=amt-fee;
  const req={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),wal:S.wal,amt,fee,net,claws:net,status:'pending',t:Date.now()};
  S.rB-=amt;S.wdQ.push(req);S.wdAmt="";
  S.txR={t:"wd",amt,fee,net,h:"Queued — "+fm(net)+" CLAWS | ID: "+req.id};
  await Promise.all([saveWdQueue(),saveChips()]);
  renderModal();
}
async function adminPayWd(id){
  const c=info();if(!c.isAdmin)return;
  const req=S.wdQ.find(r=>r.id===id);if(!req||req.status!=='pending')return;
  // 1:1 chips to CLAWS — use net chip amount (or locked claws field)
  const clawsToSend=req.claws||req.net;
  if(clawsToSend<=0){S.txR={t:"err",msg:"Invalid payout amount"};renderModal();return}
  req.status='processing';renderModal();
  try{
    let txHash;
    if(window.ethereum){
      const amt=BigInt(Math.round(clawsToSend*1e18));
      const data='0xa9059cbb'+req.wal.slice(2).toLowerCase().padStart(64,'0')+amt.toString(16).padStart(64,'0');
      txHash=await window.ethereum.request({method:'eth_sendTransaction',params:[{from:S.wal,to:CLAWS_TOKEN,data}]});
    }else{
      throw new Error("No wallet provider");
    }
    req.status='paid';req.paidAt=Date.now();req.txHash=txHash||"confirmed";
    await saveWdQueue();renderModal();
  }catch(e){
    req.status='pending';
    S.txR={t:"err",msg:"Payout failed: "+(e.message||"rejected")};
    renderModal();
  }
}
async function adminMarkPaid(id){
  const c=info();if(!c.isAdmin)return;
  const req=S.wdQ.find(r=>r.id===id);if(!req||req.status==='paid')return;
  const txHash=prompt('Enter transaction hash (or "manual" if sent externally):','manual');
  if(!txHash)return;
  req.status='paid';req.paidAt=Date.now();req.txHash=txHash.trim()||'manual';
  await saveWdQueue();renderModal();
}
async function adminRejectWd(id){
  const c=info();if(!c.isAdmin)return;
  const req=S.wdQ.find(r=>r.id===id);if(!req||req.status!=='pending')return;
  req.status='rejected';req.refunded=false;
  // Refund immediately if same player is connected, otherwise refund on their next login
  if(S.wal&&req.wal.toLowerCase()===S.wal.toLowerCase()){S.rB+=req.amt;req.refunded=true;await saveChips()}
  await saveWdQueue();renderModal();
}
async function adminRejectAll(){
  const c=info();if(!c.isAdmin)return;
  const pending=S.wdQ.filter(r=>r.status==='pending');
  if(!pending.length)return;
  let selfRefund=0;
  pending.forEach(r=>{
    r.status='rejected';r.refunded=false;
    if(S.wal&&r.wal.toLowerCase()===S.wal.toLowerCase()){r.refunded=true;selfRefund+=r.amt}
  });
  if(selfRefund>0){S.rB+=selfRefund;await saveChips()}
  await saveWdQueue();S._pendWd=0;renderModal();
}

// ── Reel Animation Engine ──
function updateReelCol(i){
  const rt=document.getElementById('rt-'+i);
  const rm=document.getElementById('rm-sym-'+i);
  const rb=document.getElementById('rb-'+i);
  if(rt)rt.textContent=S.reelTop[i];
  if(rm)rm.textContent=S.reels[i];
  if(rb)rb.textContent=S.reelBot[i];
}

function startReelSpin(){
  const t=curTh();
  for(let i=0;i<5;i++){
    reelTimers[i]=setInterval(()=>{
      S.reelTop[i]=pk(t.s);S.reels[i]=pk(t.s);S.reelBot[i]=pk(t.s);
      updateReelCol(i);
    },65+i*12);
  }
}

function stopReel(i,finalSym){
  clearInterval(reelTimers[i]);
  const t=curTh();
  const ns=t.s.filter(s=>s!==finalSym);
  S.reelTop[i]=pk(ns.length?ns:t.s);
  S.reels[i]=finalSym;
  S.reelBot[i]=pk(ns.length?ns:t.s);
  updateReelCol(i);
  const col=document.getElementById('reel-col-'+i);
  if(col){col.classList.add('landing');setTimeout(()=>col.classList.remove('landing'),350)}
}

function doSpin(){
  if(S.sp||S.hsO)return;
  if(Date.now()-(S._lastSpin||0)<300)return;S._lastSpin=Date.now();
  if(!S.wal){S.res={m:0,l:"Connect wallet first!",j:false,w:0};render();return}
  const cost=S.bet*S.batchN;
  if(totalBal()<cost){S.res={m:0,l:"Not enough chips!",j:false,w:0};S.aL=0;render();return}
  S.sp=true;S.res=null;S.winCells=[];
  const fb=Math.min(S.bB,cost),fr=cost-fb;
  S.bB-=fb;S.rB-=fr;
  S.vrfPend=true;S.vrfId="0x"+Math.random().toString(16).slice(2,10);
  // jackpot fed by losses after spin resolves
  S.tBt+=cost;
  render();

  // Start rapid cycling
  startReelSpin();sndSpin();

  // Calculate result — RNG determines multiplier, reels generated to match
  const t=curTh();
  let totalWin=0;
  for(let b=0;b<S.batchN;b++){totalWin+=Math.floor(roll()*S.bet)}

  // Use actual aggregate ratio so visual always matches payout
  const ratio=cost>0?totalWin/cost:0;

  // Generate reels that MATCH the actual outcome
  let{fin,wc:winCells,lbl,x:multStr}=genReels(ratio,t);
  if(S.batchN>1){if(totalWin>cost){lbl='BATCH WIN';multStr=(totalWin/cost).toFixed(1)+'x'}else{lbl='';multStr=''}}

  const willHS=ratio>=3&&Math.random()<.25&&S.batchN===1;

  // Stop reels sequentially
  [400,650,900,1150,1400].forEach((d,i)=>setTimeout(()=>{stopReel(i,fin[i]);sndReelStop()},d));

  setTimeout(()=>{
    clearAllReelTimers();
    const jpTier=ratio>=100?'grand':ratio>=50?'major':ratio>=25?'minor':ratio>=10?'mini':null;
    const isJP=jpTier!==null;
    try{
      S.vrfPend=false;S.vrfId=null;S.winCells=winCells;
      S.xp+=10*S.batchN+(totalWin>0?20:0)+(isJP?200:0);
      if(isJP){
        const pool=jpTier==='grand'?S.jackpot:jpTier==='major'?S.jpMajor:jpTier==='minor'?S.jpMinor:S.jpMini;
        const base=jpTier==='grand'?1000000:jpTier==='major'?250000:jpTier==='minor'?100000:50000;
        const jpWin=Math.max(pool,totalWin);
        const jpLabel=jpTier==='grand'?'5x WILD JACKPOT':jpTier==='major'?'MAJOR JACKPOT':jpTier==='minor'?'MINOR JACKPOT':'MINI JACKPOT';
        S.bB+=fb;S.rB+=fr;
        S.rB+=jpWin;S.tW+=jpWin;S.tGR+=cost+jpWin;
        if(jpTier==='grand')S.jackpot=base;else if(jpTier==='major')S.jpMajor=base;else if(jpTier==='minor')S.jpMinor=base;else S.jpMini=base;
        saveJackpot();updateJpDisplay();
        S.res={m:ratio,l:jpLabel,j:true,w:jpWin,x:jpTier==='grand'?'JACKPOT':jpTier.toUpperCase()};
        saveToLeaderboard(jpWin,ratio,[...fin]);
      }else if(totalWin>cost){
        S.bB+=fb;S.rB+=fr;
        const profit=totalWin-cost;
        S.rB+=profit;S.tW+=profit;S.tGR+=totalWin;
        S.res={m:ratio,l:lbl,j:false,w:profit,x:multStr};
      }else{
        if(totalWin>0){
          const retBB=Math.min(Math.round(fb*(totalWin/cost)),totalWin);
          S.bB+=retBB;S.rB+=(totalWin-retBB);
        }
        S.tGR+=totalWin;
        const lost=cost-totalWin;
        // 90% house pool, 10% jackpots (4% grand, 3% major, 2% minor, 1% mini)
        const lH=Math.round(lost*.9),lG=Math.round(lost*.04),lMj=Math.round(lost*.03),lMn=Math.round(lost*.02);
        const lMi=lost-lH-lG-lMj-lMn;
        S.housePool+=lH;S.jackpot+=lG;S.jpMajor+=lMj;S.jpMinor+=lMn;S.jpMini+=lMi;
        saveJackpot();updateJpDisplay();
        S.res={m:ratio,l:lbl,j:false,w:0,x:multStr};
      }
      S.hist=[{rl:[...fin],w:S.res.w||0,loss:Math.max(0,cost-totalWin),bet:cost,t:Date.now()},...S.hist.slice(0,19)];
      if(totalWin>cost&&!isJP)saveToLeaderboard(totalWin,ratio,[...fin]);
      if(isJP){sndJackpot()}else if(ratio>=3){sndBigWin()}else if(totalWin>0){sndWin()}else{sndLoss()}
      if(totalWin>0)winFlash();
      if(ratio>=10){screenShake();burst()}
    }finally{
      S.sp=false;saveChips();render();
      if(willHS&&!isJP){
        const matchSym=winCells.length>0?fin[winCells[0]]:fin[0];
        const hld=fin.map(s=>s===matchSym?1:0);
        const heldCount=hld.filter(h=>h).length;
        const vls=fin.map(s=>s===matchSym?Math.round(totalWin/Math.max(heldCount,1)):0);
        setTimeout(()=>{S.hsO=true;S.hsSy=matchSym;S.hsN=3;S.hsH=[...hld];S.hsV=[...vls];S.res={m:0,l:"HOLD & SPIN",j:false,w:0};S.winCells=[];sndHoldSpin();render();if(S.aL>0){hsAutoTimer=setTimeout(()=>doHS(),800)}},500);
      } else {
        setTimeout(()=>{S.winCells=[];render()},1200);
        checkAutoSpin();
      }
    }
  },1700);
}

function doHS(){
  if(S.sp||!S.hsO||S.hsN<=0)return;
  S.sp=true;S.res=null;S.winCells=[];
  clearAllReelTimers();
  if(hsAutoTimer){clearTimeout(hsAutoTimer);hsAutoTimer=null}
  const t=curTh();
  const nR=[...S.reels],nH=[...S.hsH],nV=[...S.hsV];
  for(let i=0;i<5;i++)if(!nH[i])nR[i]=pk(t.s);
  let got=false;
  for(let i=0;i<5;i++)if(!nH[i]&&nR[i]===S.hsSy){nH[i]=1;nV[i]=Math.round(S.bet*(2+Math.random()*8));got=true}

  // Spin only unheld reels
  for(let i=0;i<5;i++){
    if(!S.hsH[i]){
      reelTimers[i]=setInterval(()=>{
        S.reelTop[i]=pk(t.s);S.reels[i]=pk(t.s);S.reelBot[i]=pk(t.s);
        updateReelCol(i);
      },70);
    }
  }

  // Stop unheld reels
  for(let i=0;i<5;i++){
    if(!S.hsH[i]){
      setTimeout(()=>{
        clearInterval(reelTimers[i]);reelTimers[i]=null;
        S.reelTop[i]=pk(t.s);S.reels[i]=nR[i];S.reelBot[i]=pk(t.s);
        updateReelCol(i);
        const col=document.getElementById('reel-col-'+i);
        if(col){col.classList.add('landing');setTimeout(()=>col.classList.remove('landing'),350)}
      },300+i*120);
    }
  }

  setTimeout(()=>{
    clearAllReelTimers();
    try{
      S.hsH=[...nH];S.hsV=[...nV];
      const allL=nH.every(h=>h),spL=got?3:S.hsN-1;
      if(allL){
        const glW=nV.reduce((a,b)=>a+b,0)*5;S.rB+=glW;S.tW+=glW;S.hsW+=glW;
        S.res={m:0,l:"GRAND LOCK!",j:false,w:glW};sndJackpot();burst();screenShake();
        if(glW>0)saveToLeaderboard(glW,50,[S.hsSy,S.hsSy,S.hsSy,S.hsSy,S.hsSy]);
        S.hsO=false;S.hsH=[0,0,0,0,0];S.hsV=[0,0,0,0,0];S.hsSy=null;S.hsN=0;
      } else if(spL<=0){
        const hsP=nV.reduce((a,b)=>a+b,0);if(hsP>0){S.rB+=hsP;S.tW+=hsP;S.hsW+=hsP}
        S.res={m:0,l:nH.filter(h=>h).length+' Locked!',j:false,w:hsP};
        if(hsP>0){sndWin();winFlash();saveToLeaderboard(hsP,nH.filter(h=>h).length,[...nR])}
        S.hsO=false;S.hsH=[0,0,0,0,0];S.hsV=[0,0,0,0,0];S.hsSy=null;S.hsN=0;
      } else {
        S.hsN=spL;if(got){sndHoldSpin();S.res={m:0,l:"NEW LOCK! 3 respins",j:false,w:0}}
      }
    }finally{
      S.sp=false;saveChips();render();
      if(!S.hsO)checkAutoSpin();
      else if(S.aL>0){hsAutoTimer=setTimeout(()=>doHS(),800)}
    }
  },900);
}

function checkAutoSpin(){
  if(S.aL>0&&!S.sp&&!S.hsO){
    clearTimeout(arTimer);
    arTimer=setTimeout(()=>{S.aL--;doSpin()},800);
  }
}

document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-a]');
  if(!btn)return;
  const a=btn.dataset.a,v=btn.dataset.v;
  // Only close on bg click if the click target is the bg itself, not a child
  if(a==='closeModalBg'&&e.target.closest('[data-modal-inner]'))return;
  switch(a){
    case 'connect':connectW();break;
    case 'adminTap':{
      S.aTap++;if(S.aTap>=5){const c=info();if(c.isAdmin){S.shAd=true;S.aTap=0;render()}}
      setTimeout(()=>S.aTap=0,2000);break;
    }
    case 'openAdmin':{const c=info();if(c.isAdmin){S.shAd=true;render()}break;}
    case 'claimFree':claimFree();break;
    case 'refreshBal':{const ico=document.getElementById('refresh-icon');if(ico){ico.style.transform='rotate(720deg)';ico.style.transition='transform .8s'}auditBalance();break}
    case 'setBet':if(!S.sp&&!S.hsO&&S.aL<=0){S.bet=parseInt(v);saveChips();render()}break;
    case 'setBatch':if(!S.sp&&!S.hsO&&S.aL<=0){S.batchN=parseInt(v);saveChips();render()}break;
    case 'setAuto':{if(S.sp||S.hsO)break;const n=parseInt(v);if(n===0){S.aL=0;S.aB=0;clearTimeout(arTimer)}else{S.aB=n;S.aL=n;checkAutoSpin()}render();break}
    case 'mainBtn':{if(S.hsO){if(hsAutoTimer){clearTimeout(hsAutoTimer);hsAutoTimer=null}doHS();break}if(S.aL>0){S.aL=0;S.aB=0;clearTimeout(arTimer);render();return}doSpin();break}
    case 'openDeposit':S.sT='buy';S.mod='vault';S.txR=null;render();break;
    case 'openWithdraw':S.sT='withdraw';S.mod='vault';S.txR=null;render();break;
    case 'openModal':S.mod=v;if(v==='leaderboard')loadLeaderboard().then(()=>render());else render();break;
    case 'toggleSfx':_sfxOn=!_sfxOn;render();break;
    case 'closeModal':case 'closeModalBg':S.mod=null;S.shAd=false;render();break;
    case 'vaultTab':S.sT=v;S.txR=null;renderModal();break;
    case 'payTk':S.pTk=v;saveChips();renderModal();break;
    case 'buyPack':buyPack(parseInt(v));break;
    case 'doWithdraw':doWithdraw();break;
    case 'maxWd':S.wdAmt=String(S.rB);renderModal();break;
    case 'redeemPromo':redeemPromo();break;
    case 'adminPay':adminPayWd(v);break;
    case 'adminMarkPaid':adminMarkPaid(v);break;
    case 'adminReject':adminRejectWd(v);break;
    case 'adminRejectAll':adminRejectAll();break;
    case 'setTheme':{const c=info();if(c.lv<TH[v].u)return;S.tk=v;const t=TH[v];S.reels=t.s.slice(0,5);S.reelTop=t.s.slice(1,6).concat(t.s).slice(0,5);S.reelBot=t.s.slice(3,8).concat(t.s).slice(0,5);S.res=null;S.mod=null;saveChips();render();break}
  }
});

});

// Admin withdrawal notification poll
setInterval(async()=>{
  const c=info();if(!c.isAdmin||!window.AppDB)return;
  try{
    const q=await window.AppDB.getGlobal('wdQueue');
    const list=Array.isArray(q)?q.filter(r=>r&&r.id&&r.wal&&typeof r.amt==='number'):[];
    // Merge: keep local status if more advanced (pending→processing→paid/rejected)
    const rank={pending:0,processing:1,paid:2,rejected:2};
    const localMap=new Map(S.wdQ.map(r=>[r.id,r]));
    const merged=list.map(r=>{
      const loc=localMap.get(r.id);
      if(loc&&(rank[loc.status]||0)>(rank[r.status]||0))return loc;
      return r;
    });
    // Add any local entries not in remote (just submitted)
    S.wdQ.forEach(r=>{if(!list.find(x=>x.id===r.id))merged.push(r)});
    const pending=merged.filter(r=>r.status==='pending');
    const prev=S._pendWd||0;
    S._pendWd=pending.length;
    S.wdQ=merged;
    if(pending.length!==prev)render();
  }catch{}
},15000);
